#set( $d = "$" )
# Nombre del microservicio
spring.application.name=${artifactId}

# Puerto del microservicio
server.port=${puerto}

# Conexion Oracle Autonomous Database (variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# JPA: el esquema se crea con los scripts SQL de la carpeta database
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${d}{SHOW_SQL:false}

# JWT compartido con usuarios-service (clave Base64 de al menos 32 bytes)
app.jwt.secret=${JWT_SECRET}

# Origenes permitidos para el FrontEnd Angular
app.cors.allowed-origins=${d}{CORS_ORIGINS:http://localhost:4200}

# Health check para el despliegue (incluye la conexion a Oracle)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
